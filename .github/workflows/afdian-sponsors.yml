name: 更新爱发电赞助者名单

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Afdian Sponsors
        env:
          AFDIAN_USER_ID: "0c59dda8a1bb11f19b9552540025c377"
          AFDIAN_TOKEN: "${{ secrets.AFDIAN_TOKEN }}"
        run: |
          TS=$(date +%s)
          PARAMS='{"page":1}'
          SIGN=$(echo -n "${AFDIAN_TOKEN}${PARAMS}${TS}${AFDIAN_USER_ID}" | md5sum | cut -d' ' -f1)
          
          curl -s -X POST "https://afdian.net/api/open/query-sponsor" \
            -H "Content-Type: application/json" \
            -d "{\"user_id\": \"${AFDIAN_USER_ID}\", \"params\": \"${PARAMS}\", \"ts\": ${TS}, \"sign\": \"${SIGN}\"}" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);[print(f\"- [{s.get('user',{}).get('name','匿名')}](https://afdian.net/u/{s.get('user',{}).get('user_id','')})\") for s in d['data']['list'][:20]]" \
            > /tmp/sponsors.txt
          cat /tmp/sponsors.txt

      - name: Update README
        run: |
          SPONSORS=$(cat /tmp/sponsors.txt 2>/dev/null || echo "暂无赞助者")
          python3 -c "
import re
content = open('README.md', encoding='utf-8').read()
sponsors = open('/tmp/sponsors.txt', encoding='utf-8').read().strip() if __import__('os').path.exists('/tmp/sponsors.txt') else '暂无赞助者'
if not sponsors: sponsors = '暂无赞助者'
section = f'## 🙏 感谢赞助\n\n{sponsors}\n\n---\n'
pattern = r'## 🙏 感谢赞助\s*\n.*?(?=\n## |\Z)'
if '## 🙏 感谢赞助' in content:
    content = re.sub(pattern, section + '\n', content, flags=re.DOTALL)
else:
    content = content.rstrip() + '\n\n' + section
open('README.md', 'w', encoding='utf-8').write(content)
"

      - name: Commit and Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update afdian sponsors"
          git push
